<!-- About (2026-10-09): the vortex-street photograph framed in white on the left, the name running
     across it into the right column (like the wordmark over the picture on architecture.yale.edu),
     the bio small below, and a black Newsletter bar that slides up the sign-up (what was Thoughts).
     The Moon version is kept in _unused/about-moon.html. -->
<main class="me">
  <!-- the picture spot rotates through black-and-white images, all cropped to the same square
       (assets/about/01-08.jpg, made from the site's own pictures); a new one every 2.5 seconds -->
  <div class="pic rot">
    <img src="assets/about/01.jpg" alt="Satellite view of a von Kármán vortex street: dark spiralling eddies in a field of white cloud.">
  </div>
  <h1 class="name">Cecily Lowe</h1>
</main>

<a class="newsbtn" href="#newsletter">
  <span>Newsletter</span>
  <svg viewBox="0 0 12 20" aria-hidden="true"><polyline points="1.5,1.5 10,10 1.5,18.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
</a>

<div class="pinkline" aria-hidden="true"></div>

<!-- the sign-up, sliding up from the bottom with a pink line along its top like the Work lists.
     Sign-ups go to Cecily's own Google Apps Script (signups/Code.js), which adds them to the Google
     Sheet "cecilylowe.com newsletter" and emails her from newsletter@cecilylowe.com. -->
<section class="nlpanel" id="newsletter" role="dialog" aria-modal="true" aria-label="Newsletter" hidden>
  <button class="close" type="button">Close</button>
  <div class="art"><img src="assets/calabi-yau.jpg" alt="A Calabi–Yau manifold etched in a glass cube." loading="lazy"></div>
  <div class="signup">
    <form class="news bare" name="newsletter" method="POST" novalidate autocomplete="off">
      <p class="sr"><label>Leave this empty <input name="company" tabindex="-1" autocomplete="off"></label></p>
      <input id="email" name="email" type="email" placeholder="Email" aria-label="Email address, then press Enter" autocomplete="off" required>
      <button type="submit" class="sr" tabindex="-1">Sign up</button>
    </form>
    <p class="done" hidden>You&rsquo;re in.</p>
    <p class="note" aria-live="polite"></p>
  </div>
</section>

<script>
  var SIGNUPS = "https://script.google.com/macros/s/AKfycby7s0fRSxo36XJLCaGEm_sIB0D9JA1B5tILmcGSNA5L21HjQaaic8HagWgCz2CincqKUg/exec";
  (function () {
    var form = document.querySelector("form.news"), note = document.querySelector(".nlpanel .note");
    var done = document.querySelector(".nlpanel .done");
    form.reset();                                        // a fresh, empty box on every load
    var busy = false;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var email = form.email.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { note.textContent = "Please enter an email address."; return; }
      busy = true; note.textContent = "";
      fetch(SIGNUPS, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams(new FormData(form))
      }).then(function () {                         // no-cors: the reply is opaque; a network error throws
        form.hidden = true;
        done.hidden = false;
      }).catch(function () {
        note.textContent = "Something went wrong. Please try again.";
      }).then(function () { busy = false; });
    });
    window.addEventListener("pageshow", function (e) {  // coming back with the browser's Back button
      if (e.persisted) { form.reset(); form.hidden = false; done.hidden = true; note.textContent = ""; }
    });
  })();

  // About pictures: a new one every 2.5 seconds, cut straight over, as the picture changes on
  // architecture.yale.edu. Each is loaded before it is shown. Still when reduced motion is asked for.
  (function () {
    var img = document.querySelector(".pic.rot img"); if (!img) return;
    var pics = [
      ["assets/about/01.jpg", "Satellite view of a von Kármán vortex street: dark spiralling eddies in a field of white cloud."],
      ["assets/about/02.jpg", "Jupiter's Great Red Spot and the turbulent bands around it, from Voyager."],
      ["assets/about/03.jpg", "Bubble-chamber photograph: charged particle tracks curling into spirals in a magnetic field."],
      ["assets/about/04.jpg", "Close-up of the Moon's cratered surface."],
      ["assets/about/05.jpg", "Bubble-chamber photograph of a particle shower, tracks fanning out and spiralling."],
      ["assets/about/06.jpg", "Swirling cloud bands on Jupiter, from the Juno spacecraft."],
      ["assets/about/07.jpg", "A deep field of galaxies around the Bullet Cluster."],
      ["assets/about/08.jpg", "Étienne Léopold Trouvelot's drawing of the November meteors streaking across the night sky."]
    ];
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var base = img.getAttribute("src");                // keeps the ?v= stamp the publish adds
    function url(k) { return base.replace("01.jpg", pics[k][0].slice(-6)); }
    var i = 0, loaded = { 0: true };
    function load(k) { var im = new Image(); im.onload = function () { loaded[k] = true; }; im.src = url(k); }
    load(1);
    setInterval(function () {
      if (document.hidden) return;
      var k = (i + 1) % pics.length;
      if (!loaded[k]) return;                         // not here yet: try again next tick
      i = k; img.src = url(k); img.alt = pics[k][1];
      var n = (k + 1) % pics.length; if (!loaded[n]) load(n);
    }, 2500);
  })();

  // the picture's right edge sits on the left side of the "l" in "Cecily": measure where that letter's
  // ink starts (its box plus the font's 0.069em side bearing) and hand it to the stylesheet as --lx
  (function () {
    var name = document.querySelector(".me .name"), me = document.querySelector("main.me"); if (!name || !me) return;
    function line() {
      var t = name.firstChild, r = document.createRange(); if (!t || t.nodeType !== 3) return;
      var at = t.data.indexOf("l"); r.setStart(t, at); r.setEnd(t, at + 1);
      var x = r.getBoundingClientRect().left + 0.069 * parseFloat(getComputedStyle(name).fontSize) - me.getBoundingClientRect().left;
      me.style.setProperty("--lx", Math.round(x) + "px");
      var pic = document.querySelector(".pic.rot");            // the Newsletter bar starts where the picture does
      if (pic) document.documentElement.style.setProperty("--picl", Math.round(pic.getBoundingClientRect().left) + "px");
    }
    addEventListener("resize", line); if (document.fonts) document.fonts.ready.then(line); line();
  })();

  // the panel: the address carries #newsletter, so Back closes it and old /thoughts links open it
  (function () {
    var p = document.getElementById("newsletter"), btn = document.querySelector(".newsbtn"), opened = false;
    function show() {
      if (!p.hidden && p.classList.contains("up")) return;
      p.hidden = false;
      document.documentElement.classList.add("panel-open");
      p.getBoundingClientRect();                      // start from below the screen
      requestAnimationFrame(function () { p.classList.add("up"); });
      setTimeout(function () { document.getElementById("email").focus({ preventScroll: true }); }, 450);
    }
    function hide() {
      p.classList.remove("up");
      document.documentElement.classList.remove("panel-open");
      setTimeout(function () { if (!p.classList.contains("up")) p.hidden = true; }, 450);
    }
    function route() { location.hash === "#newsletter" ? show() : (p.hidden || hide()); }
    btn.addEventListener("click", function (e) { e.preventDefault(); opened = true; history.pushState(null, "", "#newsletter"); route(); });
    function close() {
      if (opened) { opened = false; history.back(); }
      else { history.replaceState(null, "", location.pathname + location.search); route(); }
    }
    p.querySelector(".close").addEventListener("click", close);
    addEventListener("keydown", function (e) { if (e.key === "Escape" && !p.hidden) close(); });
    addEventListener("popstate", function () { opened = false; route(); });
    addEventListener("hashchange", route);
    route();
  })();
</script>
</body>
</html>
