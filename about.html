<body class="plain about3">

<!-- About v15 (2026-10-12): Jupiter turning slowly in the middle, the bio on a ring just outside its edge
     (starting at the far left, running clockwise). Hover: Jupiter grows over the words and turns the pink
     duotone. Click: the newsletter slides up. Earlier versions in _unused/about-*.html. -->
<main class="stage">
  <h1 class="sr">Cecily Lowe</h1>
  <a class="orb" href="#newsletter" aria-label="Cecily Lowe is a Ph.D. student at Yale University building levitated optomechanical sensors to study the interaction between dark matter and ordinary matter. Open the newsletter sign-up.">
    <span class="disc"><img src="assets/jupiter.webp" srcset="assets/jupiter-800.webp 800w, assets/jupiter.webp 1600w" sizes="(max-width: 720px) 80vw, 66svh" alt=""></span>
    <svg viewBox="0 0 1000 1000" aria-hidden="true">
      <defs><path id="ring" d="M 72 500 A 428 428 0 1 1 72 500.01"/></defs>
      <text><textPath href="#ring" id="ringtext" lengthAdjust="spacing" data-edit="about.bio">Cecily Lowe is a Ph.D. student at Yale University building levitated optomechanical sensors to study the interaction between dark matter and ordinary matter.</textPath></text>
    </svg>
  </a>
</main>

<div class="pinkline" aria-hidden="true"></div>

<!-- the sign-up, sliding up from the bottom with a pink line along its top like the Work lists.
     Sign-ups go to Cecily's own Google Apps Script (signups/Code.js), which adds them to the Google
     Sheet "cecilylowe.com newsletter" and emails her from newsletter@cecilylowe.com. -->
<section class="nlpanel" id="newsletter" role="dialog" aria-modal="true" aria-label="Newsletter" hidden>
  <button class="close" type="button">Close</button>
  <h1>Newsletter</h1>
  <div class="art"><img src="assets/calabi-yau.jpg" alt="A Calabi–Yau manifold etched in a glass cube." loading="lazy"></div>
  <div class="signup">
    <form class="news bare" name="newsletter" method="POST" novalidate autocomplete="off">
      <p class="sr"><label>Leave this empty <input name="company" tabindex="-1" autocomplete="off"></label></p>
      <input id="email" name="email" type="email" placeholder="Email" aria-label="Email address, then press Enter" autocomplete="off" required>
      <button type="submit" class="sr" tabindex="-1">Sign up</button>
    </form>
    <p class="done" hidden>You&rsquo;re in.</p>
    <p class="note" aria-live="polite"></p>
  </div>
</section>

<script>
  var SIGNUPS = "https://script.google.com/macros/s/AKfycby7s0fRSxo36XJLCaGEm_sIB0D9JA1B5tILmcGSNA5L21HjQaaic8HagWgCz2CincqKUg/exec";
  (function () {
    var form = document.querySelector("form.news"), note = document.querySelector(".nlpanel .note");
    var done = document.querySelector(".nlpanel .done");
    form.reset();                                        // a fresh, empty box on every load
    var busy = false;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var email = form.email.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { note.textContent = "Please enter an email address."; return; }
      busy = true; note.textContent = "";
      fetch(SIGNUPS, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams(new FormData(form))
      }).then(function () {                         // no-cors: the reply is opaque; a network error throws
        form.hidden = true;
        done.hidden = false;
      }).catch(function () {
        note.textContent = "Something went wrong. Please try again.";
      }).then(function () { busy = false; });
    });
    window.addEventListener("pageshow", function (e) {  // coming back with the browser's Back button
      if (e.persisted) { form.reset(); form.hidden = false; done.hidden = true; note.textContent = ""; }
    });
  })();


  // the ring: fit the sentence to exactly one turn, leaving a small gap where it starts and ends
  (function () {
    var tp = document.getElementById("ringtext"), C = 2 * Math.PI * 428;
    function fit() { tp.setAttribute("textLength", (C - 34).toFixed(1)); }
    fit(); if (document.fonts) document.fonts.ready.then(fit);
  })();

  // Copy: puts the address on the clipboard ("Copied" for a moment, then the button goes until the pointer
  // leaves the email and comes back); if the browser refuses, selects the address so Cmd+C works
  (function () {
    var copyBtn = document.getElementById("copy"), mail = document.getElementById("mail"), box = mail.parentNode, copyTimer = 0;
    box.addEventListener("mouseleave", function () { box.classList.remove("rest"); });
    copyBtn.addEventListener("click", function () {
      function done(msg) {
        clearTimeout(copyTimer); copyBtn.textContent = msg; copyBtn.classList.add("done"); box.classList.add("rest");
        copyTimer = setTimeout(function () { copyBtn.classList.remove("done"); copyBtn.blur(); copyBtn.textContent = "Copy"; }, 1200);
      }
      function select() { var r = document.createRange(); r.selectNodeContents(mail); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); done("Press \u2318C"); }
      try { navigator.clipboard.writeText("cecily.lowe@yale.edu").then(function () { done("Copied"); }, select); } catch (e) { select(); }
    });
  })();

  // the panel: the address carries #newsletter, so Back closes it and old /thoughts links open it
  (function () {
    var p = document.getElementById("newsletter"), btn = document.querySelector(".orb"), opened = false;
    function show() {
      if (!p.hidden && p.classList.contains("up")) return;
      p.hidden = false;
      document.documentElement.classList.add("panel-open");
      p.getBoundingClientRect();                      // start from below the screen
      requestAnimationFrame(function () { p.classList.add("up"); });
      setTimeout(function () { p.querySelector(".close").focus({ preventScroll: true }); }, 450);   // the email box waits for a click
    }
    function hide() {
      p.classList.remove("up");
      document.documentElement.classList.remove("panel-open");
      setTimeout(function () { if (!p.classList.contains("up")) p.hidden = true; }, 450);
    }
    function route() { location.hash === "#newsletter" ? show() : (p.hidden || hide()); }
    btn.addEventListener("click", function (e) { e.preventDefault(); opened = true; history.pushState(null, "", "#newsletter"); route(); });
    function close() {
      if (opened) { opened = false; history.back(); }
      else { history.replaceState(null, "", location.pathname + location.search); route(); }
    }
    p.querySelector(".close").addEventListener("click", close);
    addEventListener("keydown", function (e) { if (e.key === "Escape" && !p.hidden) close(); });
    addEventListener("popstate", function () { opened = false; route(); });
    addEventListener("hashchange", route);
    route();
  })();
</script>
</body>
</html>
