        var me = ++seq; busy = me;
        calFetch(calRange(y, mo)).then(function (got) { if (busy === me) busy = null; if (me === seq) take(got, true); })
          .catch(function () { if (busy === me) busy = null; if (!have) draw("Could not load the calendar."); });
      }
      function load() {
        if (covered()) { events = have.events; draw(""); return; }
        events = have ? have.events : [];
        draw(have ? "" : "Loading\u2026");
        fetchAround();
      }
      try { var kept = JSON.parse(localStorage.getItem(STORE) || "null"); if (kept) take(kept, false); } catch (e) {}
      if (!have) draw("Loading\u2026");
      busy = -1;
      calFirst.then(function (got) { busy = null; take(got, true); if (!covered()) load(); })
        .catch(function () { busy = null; if (!have) draw("Could not load the calendar."); else if (!covered()) load(); });
      el.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-step]");
        if (b) {
          var s = +b.getAttribute("data-step");
          if (s === 0) { y = now.getFullYear(); mo = now.getMonth(); }
          else { mo += s; if (mo < 0) { mo = 11; y--; } if (mo > 11) { mo = 0; y++; } }
          load(); return;
        }
        var ev = e.target.closest(".ev[data-k]");
        if (ev) { openPop(eventHtml(events[+ev.dataset.k]), ev); return; }
        var more = e.target.closest(".more");
        if (more) {
          var k = more.dataset.day, list = "";
          events.map(function (x, i) { return i; }).sort(function (i, j) { return mins(events[i].time) - mins(events[j].time); }).forEach(function (i) {
            var x = events[i];
            if (x.startDay <= k && x.endDay >= k) list += '<button type="button" class="ev span" data-k="' + i + '" style="--c:' + x.colour + '">' +
              '<span class="ttl">' + (x.allDay ? "" : '<span class="t">' + esc(x.time) + "</span> ") + esc(x.title) + "</span>" +
              (x.location ? '<span class="loc"><i class="pin" aria-hidden="true"></i>' + esc(x.location) + "</span>" : "") + "</button>";
          });
          openPop("<h2>" + esc(longDate(day(k), true)) + '</h2><div class="list">' + list + "</div>", more); return;
        }
        if (e.target.closest(".x") || !e.target.closest(".pop")) closePop();
      });
      document.addEventListener("click", function (e) { if (!el.contains(e.target)) closePop(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePop(); });
      addEventListener("resize", function () { closePop(); draw(""); });
    }
    function remembered() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } }
    function remember(pw) { try { sessionStorage.setItem(KEY, pw); } catch (e) {} }

    if (!C) { note.textContent = "Could not load. Please check your connection and reload."; return; }

    var saved = remembered();
    if (saved) { var h = open(saved); if (h) { show(h); return; } }

    var busy = false;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var pw = form.password.value;
      if (!pw) { note.textContent = "Please enter the password."; return; }
      busy = true; note.textContent = "";
      setTimeout(function () {                // let the page repaint before the key is derived
        var html = null;
        try { html = open(pw); } catch (err) { html = null; }
        busy = false;
        if (html) { remember(pw); show(html); }
        else { note.textContent = "Incorrect password."; form.password.value = ""; form.password.focus(); }
      }, 30);
    });
  })();
</script>

</body>
</html>
