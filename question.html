<script>
  (function () {
    var C = window.CryptoJS;
    var blob = JSON.parse(document.getElementById("locked").textContent);
    var form = document.getElementById("gate"), note = document.querySelector(".gate .note");
    var gate = document.querySelector(".gate"), inside = document.getElementById("inside");
    var KEY = "cl-question";

    function b64(s) { return C.enc.Base64.parse(s); }
    function sameBytes(a, b) {               // constant-time compare of two hex strings
      if (a.length !== b.length) return false;
      var d = 0; for (var i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i); return d === 0;
    }
    function open(pw) {
      var key = C.PBKDF2(pw, b64(blob.salt), { keySize: 16, iterations: blob.iter, hasher: C.algo.SHA256 });
      var enc = C.lib.WordArray.create(key.words.slice(0, 8), 32);
      var mac = C.lib.WordArray.create(key.words.slice(8, 16), 32);
      var iv = b64(blob.iv), ct = b64(blob.ct);
      var check = C.HmacSHA256(iv.clone().concat(ct), mac).toString();
      if (!sameBytes(check, b64(blob.mac).toString())) return null;
      var out = C.AES.decrypt({ ciphertext: ct }, enc, { iv: iv, mode: C.mode.CBC, padding: C.pad.Pkcs7 }).toString(C.enc.Utf8);
      return out.indexOf("CL1:") === 0 ? out.slice(4) : null;
    }
    function show(html) {
      inside.innerHTML = html;
      gate.hidden = true;
      inside.hidden = false;
      document.body.classList.remove("locked");
    }
    function remembered() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } }
    function remember(pw) { try { sessionStorage.setItem(KEY, pw); } catch (e) {} }

    if (!C) { note.textContent = "Could not load. Please check your connection and reload."; return; }

    var saved = remembered();
    if (saved) { var h = open(saved); if (h) { show(h); return; } }

    var busy = false;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var pw = form.password.value;
      if (!pw) { note.textContent = "Please enter the password."; return; }
      busy = true; note.textContent = "";
      setTimeout(function () {                // let the page repaint before the key is derived
        var html = null;
        try { html = open(pw); } catch (err) { html = null; }
        busy = false;
        if (html) { remember(pw); show(html); }
        else { note.textContent = "Incorrect password."; form.password.value = ""; form.password.focus(); }
      }, 30);
    });
  })();
</script>
