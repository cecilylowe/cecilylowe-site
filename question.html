<!-- ?: a password box, the same pill as the newsletter sign-up. Nothing sits behind it yet:
     a static site cannot keep a page truly private, so what it unlocks still has to be decided. -->
<main class="page gate">
  <form class="news" id="gate" novalidate>
    <label for="pw" class="sr">Password</label>
    <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Enter</button>
  </form>
  <p class="note" aria-live="polite"></p>
</main>

<script>
  (function () {
    var form = document.getElementById("gate"), note = document.querySelector(".gate .note");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!form.password.value) { note.textContent = "Please enter the password."; return; }
      note.textContent = "Incorrect password.";
      form.password.value = "";
      form.password.focus();
    });
  })();
</script>
