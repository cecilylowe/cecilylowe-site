<!-- Newsletter: Jupiter front and centre, the sign-up box underneath -->
<section class="planet">
  <img src="assets/jupiter.webp" srcset="assets/jupiter-800.webp 800w, assets/jupiter.webp 1600w" sizes="(max-width: 720px) 90vw, 80vh" alt="Jupiter, seen by NASA's Juno spacecraft: swirling blue, white and rust-coloured cloud bands.">
</section>

<main class="page signup">
  <form class="news" novalidate>
    <label for="email" class="sr">Email address</label>
    <input id="email" name="email" type="email" placeholder="Your email" autocomplete="email" required>
    <button type="submit">Sign up</button>
  </form>
  <p class="note" aria-live="polite"></p>
</main>

<script>
  // Newsletter provider: Buttondown (free up to 100 subscribers). Put the username here once the
  // account exists; until then the form says sign-ups are not open yet and sends nothing.
  var BUTTONDOWN_USERNAME = "";
  (function () {
    var form = document.querySelector("form.news"), note = document.querySelector(".signup .note");
    if (BUTTONDOWN_USERNAME) {
      form.action = "https://buttondown.com/api/emails/embed-subscribe/" + BUTTONDOWN_USERNAME;
      form.method = "post";
    }
    form.addEventListener("submit", function (e) {
      var email = form.email.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { e.preventDefault(); note.textContent = "Please enter an email address."; return; }
      if (!BUTTONDOWN_USERNAME) { e.preventDefault(); note.textContent = "Sign-ups open soon."; return; }
      note.textContent = "Signing you up…";
    });
  })();
</script>

</body>
</html>
