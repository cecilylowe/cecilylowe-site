<!-- Newsletter: Jupiter front and centre, the sign-up box underneath -->
<section class="planet">
  <img src="assets/jupiter.webp" srcset="assets/jupiter-800.webp 800w, assets/jupiter.webp 1600w" sizes="(max-width: 720px) 90vw, 80vh" alt="Jupiter, seen by NASA's Juno spacecraft: swirling blue, white and rust-coloured cloud bands.">
</section>

<main class="page signup">
  <!-- Sign-ups are collected by Netlify Forms (form name "newsletter"). tools/fetch_signups.py copies
       them to subscribers/ on the Mac, which is never published or committed. -->
  <form class="news" name="newsletter" method="POST" data-netlify="true" netlify-honeypot="company" novalidate>
    <input type="hidden" name="form-name" value="newsletter">
    <p class="sr"><label>Leave this empty <input name="company" tabindex="-1" autocomplete="off"></label></p>
    <label for="email" class="sr">Email address</label>
    <input id="email" name="email" type="email" placeholder="Your email" autocomplete="email" required>
    <button type="submit">Sign up</button>
  </form>
  <p class="note" aria-live="polite"></p>
</main>

<script>
  (function () {
    var form = document.querySelector("form.news"), note = document.querySelector(".signup .note");
    var busy = false;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var email = form.email.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { note.textContent = "Please enter an email address."; return; }
      busy = true; note.textContent = "Signing you up…";
      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(new FormData(form)).toString()
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        note.textContent = "Thank you. You\u2019re signed up.";
        form.reset();
      }).catch(function () {
        note.textContent = "Something went wrong. Please try again.";
      }).then(function () { busy = false; });
    });
  })();
</script>

</body>
</html>
