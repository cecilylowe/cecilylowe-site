<script>
  // hover: the item under the pointer stays full size and turns pink; the rest in its group shrink
  document.querySelectorAll(".sqgrid").forEach(function (grid) {
    grid.querySelectorAll(".sqtile").forEach(function (t) {
      function on() { grid.classList.add("hovering"); t.classList.add("hot"); }
      function off() { grid.classList.remove("hovering"); t.classList.remove("hot"); }
      t.addEventListener("mouseenter", on); t.addEventListener("mouseleave", off);
      t.addEventListener("focus", on); t.addEventListener("blur", off);
    });
  });
</script>
