<!doctype html>
<!--
  Welcome email: sent to someone right after they join the newsletter.
  DRAFT. The wording below is a starting point; change any line in the "words" rows.
  Email apps ignore most modern CSS, so this uses tables and inline styles on purpose.
  The image is loaded from the live site (assets/jupiter-email.jpg), so it must stay published.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>You&rsquo;re in.</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <!-- preview line shown next to the subject in the inbox -->
  <div style="display:none;max-height:0;overflow:hidden;color:#ffffff;font-size:1px;line-height:1px;">
    Thanks for joining the newsletter.
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr>
      <td align="center" style="padding:48px 24px 40px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">

          <!-- the name, top left, like the site -->
          <tr>
            <td style="font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;color:#111111;padding-bottom:40px;">
              <a href="https://cecilylowe.com" style="color:#111111;text-decoration:none;">Cecily Lowe</a>
            </td>
          </tr>

          <!-- Jupiter -->
          <tr>
            <td align="center" style="padding-bottom:40px;">
              <a href="https://cecilylowe.com/newsletter.html" style="text-decoration:none;">
                <img src="https://cecilylowe.com/assets/jupiter-email.jpg" width="240" height="240" alt="Jupiter"
                     style="display:block;width:240px;height:240px;border:0;outline:none;">
              </a>
            </td>
          </tr>

          <!-- words -->
          <tr>
            <td style="font-family:Helvetica,Arial,sans-serif;font-size:22px;line-height:28px;color:#111111;padding-bottom:16px;">
              You&rsquo;re in.
            </td>
          </tr>
          <tr>
            <td style="font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#333333;padding-bottom:16px;">
              Thank you for joining my newsletter. You&rsquo;ll get the next issue in this inbox when it goes out.
            </td>
          </tr>
          <tr>
            <td style="font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#333333;padding-bottom:32px;">
              Cecily
            </td>
          </tr>

          <!-- rule and footer -->
          <tr>
            <td style="border-top:1px solid #e6e6e6;font-size:0;line-height:0;padding-top:20px;">&nbsp;</td>
          </tr>
          <tr>
            <td style="font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#999999;">
              <a href="https://cecilylowe.com" style="color:#999999;text-decoration:none;">cecilylowe.com</a><br>
              You signed up at cecilylowe.com. To stop receiving the newsletter, reply with &ldquo;unsubscribe&rdquo;.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
