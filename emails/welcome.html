<!doctype html>
<!--
  Welcome email: one image, Jupiter with "Welcome to my newsletter, I'm so happy you're here!"
  set in Inter around it. The words are drawn into the image (welcome-jupiter.jpg) because email
  apps strip curved text and don't load web fonts. Source for the image: welcome-jupiter-source.html.
  When sending, the image is attached inline (cid:welcome-jupiter) so it shows without a website.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Welcome</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <img src="welcome-jupiter.jpg" width="360" height="360"
             alt="Welcome to my newsletter, I&rsquo;m so happy you&rsquo;re here!"
             style="display:block;width:360px;max-width:100%;height:auto;border:0;outline:none;">
      </td>
    </tr>
  </table>
</body>
</html>
