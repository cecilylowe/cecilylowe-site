<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cecily Lowe</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%23111111'/%3E%3C/svg%3E">
</head>
<body class="plain">

<header class="bar">
  <a class="who" href="#" data-edit="site.name">Cecily Lowe</a>
  <nav><a href="#publications">Publications</a>, <a href="#outreach">Outreach</a>, <a href="#cv">CV</a>, <a href="#about">About</a></nav>
</header>

<!-- the spread: one photograph bleeding off the left half, a smaller one at the top of the right -->
<div class="spread">
  <img class="left" src="assets/shower.jpg" alt="Bubble-chamber photograph of an electromagnetic particle shower: a fan of spiralling tracks.">
  <img class="right" src="assets/tracks.jpg" alt="Bubble-chamber photograph of electron and positron tracks curling in a magnetic field.">
</div>

<!-- one page: each link opens its panel in place; the name closes it. Empty until there is content. -->
<main>
  <section class="panel" id="publications"></section>
  <section class="panel" id="outreach"></section>
  <section class="panel" id="cv"></section>
</main>

<!-- about: a picture on the left, a column of text on the right. Placeholders until the real
     image and words are chosen: put the image at assets/about.jpg and swap the .pic div for
     <img class="pic" src="assets/about.jpg" alt="…">. -->
<section class="about" id="about">
  <div class="pic" aria-label="image placeholder"><span>image</span></div>
  <div class="words">
    <p data-edit="about.bio">Short bio goes here: who you are, where you are, what you work on. Two or three sentences, then where your work has appeared.</p>
    <p data-edit="about.more">A second line goes here.</p>
    <p data-edit="about.contact">e: <a href="#about">email</a><br>i: <a href="#about">instagram</a></p>
    <p data-edit="about.cv">CV on request</p>
    <p data-edit="about.note"><em>A closing line in italics goes here.</em></p>
  </div>
</section>

</body>
</html>
